# Runs on every pull request (including Renovate's) and on pushes to main.
# Renovate only auto-merges an update once every job here passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: .NET API (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ShutterStream.sln
      - name: Check formatting
        run: dotnet format ShutterStream.sln --verify-no-changes --no-restore
      - run: dotnet build ShutterStream.sln --no-restore -c Release
      - name: Run tests (Testcontainers uses the runner's Docker)
        run: dotnet test ShutterStream.sln --no-build -c Release

  web:
    name: Next.js site (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shutterstream.web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: shutterstream.web/.nvmrc
          cache: npm
          cache-dependency-path: shutterstream.web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
