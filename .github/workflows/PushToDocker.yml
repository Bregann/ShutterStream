name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Build C# Docker image
        run: docker build -f ShutterStream.Core/Dockerfile -t 192.168.1.100:5000/shutterstreamapi:latest .

      - name: Push Docker image
        run: docker push 192.168.1.100:5000/shutterstreamapi:latest

      - name: Build Next.js Docker image
        run: docker build -f shutterstream.web/Dockerfile -t 192.168.1.100:5000/shutterstreamweb:latest ./shutterstream.web

      - name: Push Docker image
        run: docker push 192.168.1.100:5000/shutterstreamweb:latest
